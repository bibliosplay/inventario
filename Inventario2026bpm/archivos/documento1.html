<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario 2026 · Asistente del documento</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecef;--paper:#fff;--ink:#1c2733;--mute:#5d6b78;--line:#d5dce2;--acc:#0e6b6b;--accink:#fff;--soft:#eaf3f3;--panel:#f7f9fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181d;--paper:#1a2229;--ink:#e6ecf0;--mute:#93a2ae;--line:#2c3842;--acc:#4fc0bd;--accink:#06211f;--soft:#12292a;--panel:#161d23}}
:root[data-theme="dark"]{--bg:#12181d;--paper:#1a2229;--ink:#e6ecf0;--mute:#93a2ae;--line:#2c3842;--acc:#4fc0bd;--accink:#06211f;--soft:#12292a;--panel:#161d23}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 410px}
.tabs{display:none}
.doc{overflow:auto;padding:28px 24px}
.paper{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--acc);padding:44px 52px;font-family:Literata,Georgia,serif;line-height:1.7}
.meta{font:500 13px "IBM Plex Sans",sans-serif;color:var(--mute);margin:0 0 6px}
h1.t{font-size:34px;line-height:1.15;margin:0 0 14px;font-weight:600}
.lead{font-weight:600;margin:0 0 8px}
.paper h2{font-size:21px;margin:34px 0 8px;font-weight:600;display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.paper h3{font-size:16.5px;margin:20px 0 4px;font-weight:600;color:var(--acc)}
.paper p,.paper li{margin:6px 0}
.paper ul,.paper ol{padding-left:22px}
.ask{font:500 12px "IBM Plex Sans",sans-serif;border:1px solid var(--line);background:transparent;color:var(--acc);border-radius:99px;padding:3px 11px;cursor:pointer;white-space:nowrap}
.ask:hover,.ask[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
td,th{border:1px solid var(--line);padding:7px 10px;text-align:left}
th{background:var(--acc);color:var(--accink);font-family:"IBM Plex Sans",sans-serif}
td:first-child{font-weight:600;background:var(--panel)}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.chead{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.chead b{font-size:16px}
.modes{display:flex;gap:4px;margin-top:10px;background:var(--bg);padding:3px;border-radius:9px}
.modes button{flex:1;border:0;background:transparent;color:var(--mute);font:500 13px "IBM Plex Sans",sans-serif;padding:7px 4px;border-radius:7px;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:94%;padding:10px 13px;border-radius:12px;line-height:1.5;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--acc);color:var(--accink);border-bottom-right-radius:3px}
.m.bot{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:3px}
.m ul{margin:6px 0;padding-left:18px}
.hint{color:var(--mute);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{font:400 13px "IBM Plex Sans",sans-serif;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;text-align:left}
.chips button:hover{border-color:var(--acc)}
.comp{padding:10px 14px 14px;border-top:1px solid var(--line)}
.ctx{display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);color:var(--acc);border-radius:8px;padding:5px 10px;font-size:12.5px;margin-bottom:8px}
.ctx.on{display:flex}
.ctx button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px;line-height:1}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;max-height:120px}
.send{border:0;background:var(--acc);color:var(--accink);font:600 14px "IBM Plex Sans",sans-serif;border-radius:10px;padding:10px 16px;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:900px){
.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.tabs{display:flex;gap:6px;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px;font:500 14px "IBM Plex Sans",sans-serif}
.tabs button[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.app[data-view=doc] .chat,.app[data-view=chat] .doc{display:none}
.paper{padding:26px 20px}.doc{padding:12px}
.chat{border-left:0}
}
</style>
</head>
<body>
<div class="app" data-view="doc" id="app">
  <div class="tabs"><button id="tdoc" aria-pressed="true">Documento</button><button id="tchat" aria-pressed="false">Asistente</button></div>
  <main class="doc"><article class="paper" id="paper"></article></main>
  <aside class="chat">
    <div class="chead"><b>Asistente del documento</b>
      <div class="hint">Consulta, corrige y revisa este inventario.</div>
      <div class="modes" id="modes">
        <button data-m="ask" aria-pressed="true">Preguntar</button>
        <button data-m="fix" aria-pressed="false">Corregir</button>
        <button data-m="obs" aria-pressed="false">Observaciones</button>
      </div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="comp">
      <div class="ctx" id="ctx"><span id="ctxt"></span><button id="ctxx" aria-label="Quitar sección">×</button></div>
      <div class="row"><textarea id="q" rows="2" placeholder="Escribe tu pregunta o solicitud"></textarea><button class="send" id="send">Enviar</button></div>
    </div>
  </aside>
</div>
<script>
const S=[
{id:'s1',t:'1. Planificación y preparación',h:`
<h3>1.1 Definir el cronograma y el equipo</h3><p>Definir las fechas y asignar responsables por estantería, sección o colección. Notificar con antelación a las y los usuarios. <b>Es importante capacitar a todo el personal con el mismo criterio</b>.</p>
<h3>1.2 Establecer el alcance</h3><p>Decidir si el inventario será general (toda la colección) o parcial (solo una sección, como Referencia o Literatura Infantil). Realizar inventarios parciales periódicos evita la saturación al final del año. También se debe precisar qué se inventaría:</p><ul><li>Libros y folletos</li><li>Publicaciones periódicas</li><li>Material audiovisual y mapas</li><li>Colección patrimonial y colección local o regional</li></ul>
<h3>1.3 Definir los campos mínimos por ejemplar</h3><p>Antes de comenzar, se deben acordar los datos que se registrarán de cada ejemplar:</p>
<table><tr><th>Campo</th><th>Contenido a registrar</th></tr><tr><td>Identificación</td><td>código de barras</td></tr><tr><td>Clasificación</td><td>Clasificación Dewey y signatura topográfica</td></tr><tr><td>Ubicación física</td><td>Sala, estante, bodega</td></tr><tr><td>Estado de conservación</td><td>Bueno, regular, malo, requiere restauración</td></tr></table>
<h3>1.5 Elegir la herramienta</h3><p>Si la biblioteca ya usa un sistema de gestión se recomienda inventariar directamente sobre él.</p>
<h3>1.6 Preparar los recursos</h3><p>Se necesitarán lectores de códigos de barras, computadores con acceso al sistema de gestión, planillas de apoyo, etiquetas para observaciones y material de señalética.</p>`},
{id:'s2',t:'2. Preparación del espacio y de la colección',h:`<ul><li><b>Ordenar la estantería:</b> antes de escanear, verificar que los libros estén en su ubicación correcta según la signatura topográfica (clasificación Dewey), corrigiendo los errores de orden que se detecten.</li><li><b>Controlar los préstamos:</b> recuperar los libros que están en préstamo o marcar cuáles están fuera de la biblioteca.</li><li><b>Identificar material sin procesar:</b> donaciones, libros sin sello o sin código de barras.</li><li><b>Etiquetar los estantes:</b> asignar a cada uno un código (sala–estante–bandeja), de modo que cada libro tenga una ubicación exacta.</li></ul>`},
{id:'s3',t:'3. Ejecución técnica del inventario',h:`<p>Esta es la fase operativa, en la que se revisa la colección ejemplar por ejemplar.</p><ol><li><b>Recorrido de la estantería.</b> Avanzar estante por estante, de izquierda a derecha y de arriba abajo, sin saltarse ninguno. Trabajar en bloques pequeños para no perder el control.</li><li><b>Escaneo sistemático.</b> Registrar ejemplar por ejemplar, no solo títulos: dos copias del mismo libro son dos registros. Escanear el código de barras de cada ejemplar; Si un libro no tiene código, generar una alerta para su catalogación.</li><li><b>Verificación en el sistema (doble chequeo).</b> Trabajar en parejas: mientras una persona escanea, otra confirma en el sistema que los datos coinciden. Esto reduce errores en la circulación y en la base de datos. Ejemplo los 600 códigos inexistentes del inventario 2025</li><li><b>Registro de hallazgos.</b> No limitarse a contar. Anotar o fotografiar los casos especiales: libros dañados (mutilados, desencuadernados, con hongos), ejemplares duplicados innecesarios, material obsoleto (por ejemplo, manuales de software antiguos), ejemplares antiguos o raros y material sin identificar.</li></ol>`},
{id:'s4',t:'4. Conciliación',h:`<p>En esta fase se garantiza que el inventario sea confiable.</p><ul><li>Cruzar el conteo físico con el catálogo y con los registros históricos.</li><li>Clasificar las diferencias encontradas:<ul><li><b>Faltantes:</b> figuran en el catálogo 2025, pero no están en la estantería (perdidos, extraviados o mal ubicados).</li><li><b>Sobrantes:</b> están en la estantería o cajas, pero no figuran en el catálogo (sin procesar).</li><li><b>Duplicados o errores:</b> problemas de código o de datos.</li></ul></li><li>Documentar todo en un acta, ya que las bajas suelen requerir respaldo administrativo.</li></ul>`},
{id:'s5',t:'5. Control de calidad',h:`<ul><li><b>Muestra aleatoria:</b> volver a la estantería para revisar entre un 5 % y un 10 % de los ejemplares y verificar que los datos coincidan.</li></ul>`},
{id:'s6',t:'6. Depuración y actualización de la colección',h:`<p>El inventario es la oportunidad perfecta para realizar el expurgo (selección negativa) y el descarte.</p><ul><li><b>Aplicar criterios de expurgo:</b> evaluar cada libro según su pertinencia, estado físico, uso (préstamos), actualidad y duplicidad. Por ejemplo, un libro de informática de hace 15 años o un plan de estudio de los años 80 debe salir de la colección.</li><li><b>Documentar el descarte:</b> el material retirado no se elimina sin más. Se debe elaborar un listado con autor, título y número de ejemplares. Este proceso es fundamental para liberar espacio físico y mantener la colección atractiva y relevante.</li></ul>`},
{id:'s7',t:'7. Resultados y cierre',h:`<p>Un inventario completo entrega:</p><ul><li>La base de datos final con todos los ejemplares por título</li><li>Un informe con totales por sección, por materia, por estado de conservación y por procedencia.</li><li>La lista de faltantes, sobrantes y bajas propuestas.</li><li>Un plan de acción: qué restaurar, qué descartar (expurgo), qué adquirir y qué procesar.</li><li>Un calendario de inventario periódico (anual o cada dos años, con conteos parciales por sección).</li></ul>`},
{id:'s8',t:'8. Consideraciones adicionales',h:`<ul><li><b>Colección local y patrimonial del Maule:</b> la Región del Maule tiene un componente patrimonial y local importante, por lo que se sugiere prestar especial atención a esta colección. Verificar que las obras (autores locales, historia regional) estén correctamente catalogadas y en buen estado.</li><li><b>Seguridad de la información:</b> guardar copias de respaldo de la base de datos en más de un lugar.</li></ul>`}
];
const $=s=>document.querySelector(s);
const paper=$('#paper');
paper.innerHTML='<p class="meta">Biblioteca Pública del Maule · 24 de septiembre de 2026</p><h1 class="t">Inventario 2026</h1><p class="lead">Un buen inventario es un proceso con fases, no solo una lista de códigos de barras. Antes de tocar un solo libro, es necesario contar con un plan claro.</p>'+
S.map(s=>`<section id="${s.id}"><h2><span>${s.t}</span><button class="ask" data-s="${s.id}" aria-pressed="false">Consultar sección</button></h2>${s.h}</section>`).join('');
const tmp=document.createElement('div');
const docText='Biblioteca Pública del Maule, 24 de septiembre de 2026\nUn buen inventario es un proceso con fases, no solo una lista de códigos de barras. Antes de tocar un solo libro, es necesario contar con un plan claro.\n\n'+
S.map(s=>{tmp.innerHTML=s.h;return s.t+'\n'+tmp.innerText.replace(/\n{2,}/g,'\n')}).join('\n\n');

let mode='ask',ctx=null,hist=[],busy=false,sample=null,ac=null;
if(window.claude&&claude.use){claude.use('sample').then(s=>{sample=s}).catch(()=>{})}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[-*] (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>').replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
const msgs=$('#msgs');
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}

const CH={ask:['¿Qué debo hacer antes de escanear?','¿Cómo se clasifican las diferencias en la conciliación?','Resume el documento en 5 puntos'],
fix:['Corrige todo el documento','Corrige solo ortografía y puntuación','Reescribe con un tono más formal'],
obs:['Revisa todo el documento','¿Qué falta para que el inventario sea completo?','¿Qué riesgos ves en el proceso?']};
const HELP={ask:'Pregunta lo que necesites sobre el contenido. Respondo solo con lo que dice el documento.',fix:'Pido correcciones de ortografía, puntuación y redacción, con el texto original y la propuesta.',obs:'Pido observaciones sobre vacíos, incoherencias y mejoras del contenido.'};
function intro(){msgs.innerHTML='';const d=add('bot',`<div class="hint">${HELP[mode]}</div><div class="chips">${CH[mode].map(x=>`<button>${x}</button>`).join('')}</div>`);
d.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>send(b.textContent))}
intro();

$('#modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
if(!hist.length)intro();
$('#q').placeholder=mode==='ask'?'Escribe tu pregunta':mode==='fix'?'Indica qué corregir (o pulsa una opción)':'Indica qué revisar (o pulsa una opción)'};

function setCtx(id){const cur=ctx&&ctx.id===id;ctx=cur?null:S.find(s=>s.id===id);
document.querySelectorAll('.ask').forEach(b=>b.setAttribute('aria-pressed',!!ctx&&b.dataset.s===ctx.id));
$('#ctx').classList.toggle('on',!!ctx);$('#ctxt').textContent=ctx?'Sección: '+ctx.t:'';
if(ctx){view('chat');$('#q').focus()}}
paper.onclick=e=>{const b=e.target.closest('.ask');if(b)setCtx(b.dataset.s)};
$('#ctxx').onclick=()=>{if(ctx)setCtx(ctx.id)};

function view(v){$('#app').dataset.view=v;$('#tdoc').setAttribute('aria-pressed',v==='doc');$('#tchat').setAttribute('aria-pressed',v==='chat')}
$('#tdoc').onclick=()=>view('doc');$('#tchat').onclick=()=>view('chat');

const PRE='Eres el asistente del documento «Inventario 2026» de la Biblioteca Pública del Maule. Responde siempre en español, de forma breve y concreta, basándote solo en el documento; si algo no está en él, dilo. No inventes datos.\n\nDOCUMENTO:\n<<<\n'+docText+'\n>>>\n\n';
const HINT={ask:'Modo consulta: responde la pregunta y cita la sección relevante.',
fix:'Modo corrección: revisa ortografía, puntuación, redacción y coherencia. Responde con una lista; cada ítem con **Sección**, el texto original entre «», la **propuesta** y el motivo en una línea. Si no hay errores, dilo.',
obs:'Modo observaciones: da observaciones críticas de contenido (vacíos, incoherencias, numeración, frases incompletas, riesgos operativos, mejoras). Lista priorizada de máximo 8 ítems, cada uno con la sección y una sugerencia concreta.'};

async function send(text){
  text=(text||'').trim();if(!text||busy)return;
  if(!sample){if(!hist.length)msgs.innerHTML='';add('bot','El asistente solo funciona al abrir esta página dentro de Claude, con el permiso correspondiente.');return}
  if(!hist.length)msgs.innerHTML='';
  busy=true;$('#send').disabled=true;$('#q').value='';
  add('me',esc(text)+(ctx?`<div style="opacity:.8;font-size:12px;margin-top:4px">${esc(ctx.t)}</div>`:''));
  const out=add('bot','<span class="hint">Pensando…</span>');
  hist.push({role:'user',content:text});
  const n=Math.min(hist.length,7);
  const turns=hist.slice(-n).map(x=>({...x}));
  turns[0].content=PRE+turns[0].content;
  const last=turns[turns.length-1];
  last.content=HINT[mode]+(ctx?`\nLimítate a esta sección: «${ctx.t}».`:'')+'\n\n'+(turns.length===1?last.content.slice(PRE.length):last.content);
  if(turns.length===1)last.content=PRE+last.content;
  try{
    ac=new AbortController();
    const r=await sample(turns,{cache:false,signal:ac.signal,onText:({text})=>{out.innerHTML=md(text);msgs.scrollTop=msgs.scrollHeight}});
    out.innerHTML=md(r.text);hist.push({role:'assistant',content:r.text});
  }catch(e){
    hist.pop();
    out.innerHTML=e&&e.code==='not_granted'?'No diste permiso para usar el asistente. Recarga la página para intentarlo de nuevo.':e&&e.code==='rate_limited'?'Hay demasiadas solicitudes. Espera un momento y vuelve a enviar.':'No se pudo obtener la respuesta. Vuelve a enviar tu mensaje.';
  }
  busy=false;$('#send').disabled=false;msgs.scrollTop=msgs.scrollHeight;
}
$('#send').onclick=()=>send($('#q').value);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#q').value)}});
</script>
</body>
</html>
