<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glosario ALEPH v.24</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --ink:#241f18; --ink-soft:#5c5548;
  --accent:#7a4f2b; --accent2:#b8863f; --line:#e3dccd; --tag-bg:#efe6d4;
  --shadow:0 1px 3px rgba(36,31,24,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181510; --panel:#231f19; --ink:#f2ede2; --ink-soft:#bdb2a0;
    --accent:#d9a05b; --accent2:#e8c078; --line:#39332a; --tag-bg:#332c22;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#181510; --panel:#231f19; --ink:#f2ede2; --ink-soft:#bdb2a0;
  --accent:#d9a05b; --accent2:#e8c078; --line:#39332a; --tag-bg:#332c22;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Iowan Old Style","Georgia",serif;
  min-height:100%;
}
header{
  padding:28px 20px 16px; text-align:center;
  border-bottom:1px solid var(--line);
}
header h1{margin:0 0 4px; font-size:1.6rem; letter-spacing:.02em;}
header p{margin:0; color:var(--ink-soft); font-size:.92rem;}
main{max-width:880px; margin:0 auto; padding:20px 16px 60px;}

.ask{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:16px; box-shadow:var(--shadow); margin-bottom:22px;
}
.ask label{font-size:.85rem; color:var(--ink-soft); display:block; margin-bottom:6px;}
.ask-row{display:flex; gap:8px;}
.ask input[type=text]{
  flex:1; min-width:0; padding:10px 12px; border-radius:9px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink);
  font-family:inherit; font-size:1rem;
}
.ask button{
  padding:10px 16px; border-radius:9px; border:none;
  background:var(--accent); color:#fff; font-family:inherit; font-size:.95rem;
  cursor:pointer;
}
.ask button:active{opacity:.85;}
#answer{margin-top:12px; font-size:.98rem; line-height:1.5;}
#answer .hit{border-top:1px dashed var(--line); padding-top:10px; margin-top:10px;}
#answer .hit:first-child{border-top:none; margin-top:0; padding-top:0;}
#answer .term-name{color:var(--accent); font-weight:600;}
#answer .muted{color:var(--ink-soft); font-size:.88rem;}

.filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
.filters button{
  border:1px solid var(--line); background:var(--panel); color:var(--ink-soft);
  padding:5px 11px; border-radius:999px; font-size:.78rem; cursor:pointer; font-family:inherit;
}
.filters button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

#search{
  width:100%; padding:10px 12px; margin-bottom:18px; border-radius:9px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  font-family:inherit; font-size:1rem;
}

.term{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);
}
.term h3{margin:0 0 4px; font-size:1.05rem;}
.term .cat{
  display:inline-block; background:var(--tag-bg); color:var(--accent2);
  font-size:.68rem; letter-spacing:.03em; text-transform:uppercase;
  padding:2px 8px; border-radius:999px; margin-bottom:6px;
}
.term p{margin:6px 0 0; color:var(--ink-soft); font-size:.93rem; line-height:1.5;}
.term .syn{font-size:.78rem; color:var(--ink-soft); margin-top:6px; font-style:italic;}

#empty{color:var(--ink-soft); text-align:center; padding:20px; font-size:.9rem;}
footer{text-align:center; color:var(--ink-soft); font-size:.75rem; padding:10px 0 30px;}
</style>
</head>
<body>
<header>
  <h1>Glosario ALEPH v.24</h1>
  <p>Términos de catalogación del sistema integrado de gestión bibliotecaria Ex Libris ALEPH</p>
</header>
<main>

  <div class="ask">
    <label for="q">Pregunta algo (ej. "¿qué es un ítem?", "número de sistema", "cómo se llama la base de autoridades")</label>
    <div class="ask-row">
      <input type="text" id="q" placeholder="Escribe tu pregunta...">
      <button id="askBtn">Preguntar</button>
    </div>
    <div id="answer"></div>
  </div>

  <input type="text" id="search" placeholder="Filtrar glosario por palabra...">
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <div id="empty" style="display:none;">No se encontraron términos.</div>

</main>
<footer>Glosario de referencia general para ALEPH v.24 · no reemplaza la documentación oficial de Ex Libris</footer>

<script>
const TERMS = [
{t:"Base bibliográfica (BIB)", cat:"Bases de datos", syn:"base BIB, biblioteca bibliográfica",
 d:"Base de datos de ALEPH que contiene los registros bibliográficos (descripciones catalográficas en formato MARC 21) de los materiales de la colección."},
{t:"Base administrativa (ADM)", cat:"Bases de datos", syn:"base ADM",
 d:"Base de datos que almacena la información administrativa vinculada a cada título: registros de ítem, préstamos, adquisiciones y suscripciones."},
{t:"Sub-biblioteca (Sublibrary)", cat:"Bases de datos", syn:"biblioteca, sublibrary",
 d:"Unidad administrativa dentro de una base ADM que representa una biblioteca o sucursal específica; agrupa los ítems, políticas de préstamo y ubicaciones propias de esa unidad."},

{t:"Registro bibliográfico", cat:"Registros", syn:"registro BIB, ficha catalográfica",
 d:"Descripción catalográfica de un recurso en formato MARC 21, compuesta por campos y subcampos, almacenada en la base BIB."},
{t:"Número de sistema", cat:"Registros", syn:"System Number, CNS, docnumber",
 d:"Identificador único y consecutivo que ALEPH asigna automáticamente a cada registro (bibliográfico, de autoridad, de ítem, etc.) al crearlo."},
{t:"Campo MARC", cat:"Registros", syn:"tag, etiqueta",
 d:"Unidad de datos identificada por una etiqueta numérica de tres dígitos (ej. 245 para el título) dentro de un registro MARC 21."},
{t:"Subcampo", cat:"Registros", syn:"delimitador, $a $b",
 d:"División de un campo MARC, marcada con un delimitador (ej. $a, $b), que separa distintos elementos de información dentro del mismo campo."},
{t:"Registro duplicado", cat:"Registros", syn:"duplicate record",
 d:"Copia exacta de un registro existente, generada dentro de ALEPH para servir de base a un registro nuevo relacionado (por ejemplo, otra edición)."},
{t:"Registro completo / breve", cat:"Registros", syn:"full view, brief view",
 d:"Dos modos de visualización de un registro en ALEPH: la vista breve muestra un resumen (autor, título, año); la vista completa muestra todos los campos MARC."},
{t:"Título", cat:"Registros", syn:"campo 245, title",
 d:"Campo MARC (245) que contiene el título propiamente dicho del recurso, y en su caso el subtítulo y la mención de responsabilidad, dentro del registro bibliográfico."},
{t:"Autor", cat:"Registros", syn:"campo 100/700, author, punto de acceso principal",
 d:"Campo MARC que registra al responsable intelectual de la obra: el campo 100 para el autor principal y el 700 para autores o colaboradores adicionales."},
{t:"Descripción", cat:"Registros", syn:"área de descripción física, extensión",
 d:"Conjunto de datos del registro bibliográfico (extensión, dimensiones, material acompañante) que describe físicamente el recurso, correspondiente al área de descripción de las ISBD/MARC (campo 300)."},
{t:"Clasificación", cat:"Registros", syn:"número de clasificación, campo 082/090",
 d:"Notación que ubica temáticamente el recurso dentro de un sistema de clasificación (ej. CDU, Dewey), registrada en el campo correspondiente del registro bibliográfico y usada para definir la signatura topográfica."},
{t:"ISBN", cat:"Registros", syn:"campo 020, International Standard Book Number",
 d:"Identificador numérico internacional único de una edición de un libro, registrado en el campo MARC 020 del registro bibliográfico."},
{t:"ISSN", cat:"Registros", syn:"campo 022, International Standard Serial Number",
 d:"Identificador numérico internacional único que identifica a una publicación seriada (revista, periódico), registrado en el campo MARC 022."},

{t:"Registro de ítem", cat:"Ítems y ejemplares", syn:"item record, ejemplar",
 d:"Registro en la base ADM que representa una copia física concreta de un título: incluye código de barras, ubicación, estado y condiciones de préstamo."},
{t:"Código de barras", cat:"Ítems y ejemplares", syn:"barcode",
 d:"Identificador único asignado a cada ejemplar físico, usado para las transacciones de circulación (préstamo, devolución, reserva)."},
{t:"Campo 852", cat:"Ítems y ejemplares", syn:"campo de ubicación",
 d:"Campo MARC del registro de holdings que indica la sub-biblioteca, colección y signatura topográfica donde se ubica el material."},
{t:"Estado del ítem", cat:"Ítems y ejemplares", syn:"item status, item process status",
 d:"Código que indica la situación de disponibilidad de un ejemplar (en sala, prestado, en proceso técnico, extraviado, etc.)."},
{t:"Proceso técnico", cat:"Ítems y ejemplares", syn:"technical services",
 d:"Etapa administrativa por la que pasa un material entre su ingreso y su disponibilidad final para el préstamo (catalogación, sellado, rotulado, etc.)."},
{t:"Colección", cat:"Ítems y ejemplares", syn:"collection code",
 d:"Campo del registro de ítem que agrupa el material dentro de una sub-biblioteca según su ubicación o tipo (ej. Referencia, Hemeroteca, Sala infantil), afinando la ubicación más allá de la sub-biblioteca."},
{t:"Volumen", cat:"Ítems y ejemplares", syn:"enumeración, piece designation",
 d:"Campo del registro de ítem que identifica el tomo, número o fascículo específico que representa ese ejemplar, usado especialmente en obras multivolumen y publicaciones seriadas."},
{t:"Ejemplar", cat:"Ítems y ejemplares", syn:"copia, copy, item",
 d:"Copia física concreta de un título dentro de la colección; cada ejemplar tiene su propio registro de ítem, código de barras y estado, aunque comparta el mismo registro bibliográfico."},
{t:"Nota interna", cat:"Ítems y ejemplares", syn:"Note Internal",
 d:"Campo del registro de ítem visible solo para el personal de la biblioteca en el cliente de catalogación/circulación, usado para observaciones de uso interno (estado, incidencias, etc.)."},
{t:"Nota OPAC", cat:"Ítems y ejemplares", syn:"Note OPAC, nota pública",
 d:"Campo del registro de ítem que se muestra a los usuarios finales en el catálogo público, con información relevante sobre ese ejemplar en particular (ej. \"con CD adjunto\")."},
{t:"Estadística", cat:"Ítems y ejemplares", syn:"Statistics Note, categoría estadística",
 d:"Campo o código del registro de ítem que clasifica el material para fines de reportes estadísticos de circulación y colección, sin ser visible para el usuario final."},

{t:"Índice de palabras", cat:"Indexación y búsqueda", syn:"word index",
 d:"Índice generado automáticamente por ALEPH que descompone el texto de los campos indexados en palabras individuales para permitir búsquedas por término."},
{t:"OPAC", cat:"Indexación y búsqueda", syn:"catálogo público, catálogo en línea",
 d:"Módulo de catálogo público en línea (Online Public Access Catalog) donde los usuarios finales realizan sus búsquedas y consultan disponibilidad."},

{t:"Campo 856", cat:"Formato MARC", syn:"enlace electrónico, URL",
 d:"Campo MARC 21 que contiene la ubicación y el acceso electrónico de un recurso, típicamente una URL a la versión digital o a un recurso relacionado."},
{t:"MARC 21", cat:"Formato MARC", syn:"formato MARC",
 d:"Formato estándar de codificación de registros bibliográficos y de autoridad, estructurado en campos y subcampos, utilizado por ALEPH como formato de catalogación."},
{t:"Catalogación copiada / importada", cat:"Formato MARC", syn:"import, Z39.50",
 d:"Incorporación de un registro proveniente de otra fuente (otro catálogo, un proveedor o un protocolo como Z39.50) al catálogo local, generalmente con ajustes locales."},

{t:"Módulo de Circulación", cat:"Circulación", syn:"Circulation module",
 d:"Módulo de ALEPH que gestiona los préstamos, devoluciones, renovaciones, reservas y multas asociados a los ítems y a los usuarios de la biblioteca."},
{t:"Registro de lector", cat:"Circulación", syn:"borrower record, patron record, registro de usuario",
 d:"Registro almacenado en la base ADM con los datos personales, de contacto y de afiliación de un usuario habilitado para pedir materiales en préstamo."},
{t:"Perfil de lector (Bor Status)", cat:"Circulación", syn:"borrower status, categoría de usuario",
 d:"Código que clasifica a un usuario (ej. estudiante, docente, público general) y que, combinado con el estado del ítem, determina las condiciones de préstamo aplicables."},
{t:"Transacción de préstamo", cat:"Circulación", syn:"loan, checkout, préstamo",
 d:"Operación que registra la entrega de un ítem a un usuario, vinculando el código de barras del ejemplar con el registro del lector y fijando la fecha de vencimiento."},
{t:"Fecha de vencimiento", cat:"Circulación", syn:"due date",
 d:"Fecha límite calculada automáticamente por ALEPH, según la política de préstamo aplicable, en la que un ítem prestado debe ser devuelto."},
{t:"Renovación", cat:"Circulación", syn:"renewal",
 d:"Extensión del plazo de préstamo de un ítem ya prestado, sujeta a las reglas de la política de préstamo (número máximo de renovaciones, reservas pendientes, etc.)."},
{t:"Devolución", cat:"Circulación", syn:"return, check-in",
 d:"Transacción que cierra un préstamo al reingresar el ítem a la biblioteca, actualizando su estado de disponibilidad y calculando multas si corresponde."},
{t:"Multa", cat:"Circulación", syn:"fine, cash transaction",
 d:"Cargo monetario generado automáticamente por atraso, daño o pérdida de un ítem, registrado en la cuenta del usuario dentro del módulo de Circulación."},
{t:"Bloqueo de usuario (lien)", cat:"Circulación", syn:"patron block, lien",
 d:"Restricción aplicada a la cuenta de un lector (por ejemplo, por multas impagas) que impide realizar nuevos préstamos hasta que se resuelva la causa del bloqueo."},
{t:"Historial de préstamos", cat:"Circulación", syn:"loan history",
 d:"Registro de las transacciones de préstamo pasadas de un usuario o de un ítem, disponible según la configuración de retención de historial del sistema."},
{t:"Aviso de circulación", cat:"Circulación", syn:"notice, carta de reclamo, recordatorio",
 d:"Comunicación generada automáticamente por el Gestor de Tareas para notificar al usuario sobre atrasos, reservas disponibles o vencimientos próximos."},

{t:"Inventario bibliotecario", cat:"Inventario", syn:"stocktaking, conteo de colección",
 d:"Proceso periódico de verificación física de la colección, cotejando los ítems presentes en el estante con los registros del catálogo para detectar faltantes o extravíos."},
{t:"Inventario en línea", cat:"Inventario", syn:"Online Inventory",
 d:"Modalidad de inventario en la que el escaneo de códigos de barras se realiza con conexión directa a ALEPH, actualizando de inmediato el estado y la fecha de inventario de cada ítem."},
{t:"Inventario tradicional (offline)", cat:"Inventario", syn:"Traditional Inventory, offline inventory",
 d:"Modalidad de inventario en la que los códigos de barras se recolectan sin conexión (por ejemplo, con un lector portátil) y luego se cargan en ALEPH como archivo para su cotejo."},
{t:"Definición de inventario", cat:"Inventario", syn:"Inventory Definition, item-01",
 d:"Servicio de ALEPH (item-01) que marca un rango de ítems —por sub-biblioteca, colección o signatura— como el conjunto a inventariar y genera un número de reporte de estante."},
{t:"Número de reporte de estante", cat:"Inventario", syn:"Shelf Report Number",
 d:"Identificador que agrupa el rango de ítems definido para una operación de inventario, usado luego para escanear y cotejar ese lote de material."},
{t:"Marcado de inventario", cat:"Inventario", syn:"Inventory Marking",
 d:"Función del módulo de Catalogación/Circulación donde se escanean los códigos de barras de los ítems físicamente presentes, registrando su paso por el inventario."},
{t:"Fecha de inventario del ítem", cat:"Inventario", syn:"z30-inventory-number-date",
 d:"Campo interno del registro de ítem que guarda la fecha y el número de la última vez que ese ejemplar fue verificado en un proceso de inventario."},
{t:"Reconstrucción de clave de ordenación", cat:"Inventario", syn:"Rebuild Call Number Sort Key, item-06",
 d:"Servicio de ALEPH (item-06) que regenera la clave interna de ordenamiento de las signaturas topográficas, asegurando que el orden de estante sea correcto antes de inventariar."},
{t:"Formulario de recuperación general", cat:"Inventario", syn:"General Retrieval Form, ret-adm-01",
 d:"Herramienta de búsqueda avanzada sobre la base ADM usada, entre otros fines, para revisar antes de un inventario que los ítems tengan signatura y tipo de signatura correctos."},
{t:"Ítem mal ubicado", cat:"Inventario", syn:"misshelved item, fuera de orden",
 d:"Ejemplar que, al ser escaneado durante el inventario, se detecta fuera del orden de signatura esperado en el estante y debe ser reubicado."},
{t:"Ítem faltante", cat:"Inventario", syn:"missing item",
 d:"Ejemplar que figura en el catálogo pero no fue localizado durante el inventario; su estado puede marcarse como perdido o pendiente de búsqueda."},
{t:"Cotejo", cat:"Inventario", syn:"matching, verificación",
 d:"Comparación entre lo escaneado físicamente en el estante y los registros existentes en el sistema, para identificar coincidencias, faltantes o ítems no catalogados."},
{t:"Expurgo / descarte", cat:"Inventario", syn:"weeding, desafectación",
 d:"Proceso de selección y retiro de material obsoleto, deteriorado o de escaso uso de la colección, generalmente decidido a partir de los resultados del inventario."},
{t:"Baja de material", cat:"Inventario", syn:"withdrawal, deaccession",
 d:"Eliminación formal de un ítem del catálogo y de la colección (por pérdida, descarte o donación), actualizando su estado y retirando su registro de disponibilidad."},
{t:"Censo de colección", cat:"Inventario", syn:"collection count, estadística de existencias",
 d:"Cuantificación total de los ítems de una colección o sub-biblioteca en un momento dado, usada como línea base o resultado de un proceso de inventario."},
{t:"Fecha de inventario", cat:"Inventario", syn:"inventory date",
 d:"Campo del registro de ítem que se actualiza automáticamente con la fecha en que ese ejemplar fue escaneado y verificado en la ronda de inventario en curso."},
{t:"Fecha de último inventario", cat:"Inventario", syn:"last inventory date",
 d:"Fecha del inventario anterior ya completado, conservada como referencia para saber cuánto tiempo lleva un ejemplar sin ser verificado físicamente."}
];

const CATS = [...new Set(TERMS.map(x=>x.cat))];
let activeCat = "Todos";

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function renderFilters(){
  const box = document.getElementById("filters");
  box.innerHTML = "";
  ["Todos", ...CATS].forEach(c=>{
    const b = document.createElement("button");
    b.textContent = c;
    if(c===activeCat) b.classList.add("active");
    b.onclick = ()=>{ activeCat = c; renderFilters(); renderList(); };
    box.appendChild(b);
  });
}

function renderList(){
  const q = norm(document.getElementById("search").value.trim());
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";
  const filtered = TERMS.filter(x=>{
    if(activeCat!=="Todos" && x.cat!==activeCat) return false;
    if(!q) return true;
    return norm(x.t).includes(q) || norm(x.d).includes(q) || norm(x.syn).includes(q);
  });
  if(filtered.length===0){ empty.style.display="block"; return; }
  empty.style.display="none";
  filtered.forEach(x=>{
    const el = document.createElement("div");
    el.className = "term";
    el.innerHTML = `<span class="cat">${x.cat}</span><h3>${x.t}</h3><p>${x.d}</p>${x.syn?`<div class="syn">Sinónimos / véase: ${x.syn}</div>`:""}`;
    list.appendChild(el);
  });
}

function scoreTerm(term, words){
  const hay = norm(term.t + " " + term.syn + " " + term.d + " " + term.cat);
  let score = 0;
  words.forEach(w=>{
    if(w.length<3) return;
    if(norm(term.t).includes(w)) score += 5;
    if(norm(term.syn).includes(w)) score += 4;
    if(hay.includes(w)) score += 1;
  });
  return score;
}

function answer(){
  const raw = document.getElementById("q").value.trim();
  const box = document.getElementById("answer");
  if(!raw){ box.innerHTML = ""; return; }
  const stop = ["que","qué","es","el","la","los","las","un","una","de","del","en","como","cómo","se","llama","para","y","o","sirve","significa","por"];
  const words = norm(raw).split(/[^a-z0-9]+/).filter(w=>w && !stop.includes(w));
  const ranked = TERMS.map(t=>({t, s:scoreTerm(t, words)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
  if(ranked.length===0){
    box.innerHTML = `<p class="muted">No encontré un término que coincida bien. Prueba con otra palabra clave, o revisa el glosario filtrando abajo.</p>`;
    return;
  }
  box.innerHTML = ranked.map((r,i)=>`
    <div class="hit">
      <span class="term-name">${r.t.t}</span> <span class="muted">(${r.t.cat})</span>
      <p style="margin:4px 0 0;">${r.t.d}</p>
    </div>`).join("");
}

document.getElementById("askBtn").addEventListener("click", answer);
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Enter") answer(); });
document.getElementById("search").addEventListener("input", renderList);

renderFilters();
renderList();
</script>
</body>
</html>
