<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clasificación Decimal Dewey — Fichero interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#20241f; --paper:#e9e2cd; --paper-2:#ddd3b6; --wood:#3b2a1e; --wood-2:#2a1d14;
  --brass:#a9772f; --brass-bright:#c68f3e; --line:rgba(32,36,31,0.22);
  --shadow: 0 10px 24px rgba(0,0,0,0.28);
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9e2cd; --paper:#241d16; --paper-2:#2e251b; --wood:#151009; --wood-2:#0d0a06;
    --brass:#c68f3e; --brass-bright:#e0ac5b; --line:rgba(233,226,205,0.18);
  }
}
:root[data-theme="dark"]{
  --ink:#e9e2cd; --paper:#241d16; --paper-2:#2e251b; --wood:#151009; --wood-2:#0d0a06;
  --brass:#c68f3e; --brass-bright:#e0ac5b; --line:rgba(233,226,205,0.18);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%;
  background: linear-gradient(180deg, var(--wood), var(--wood-2));
  color:var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.wrap{max-width:920px; margin:0 auto; padding:2.5rem 1.25rem 4rem;}
header{margin-bottom:2rem;}
.kicker{font-family:"IBM Plex Mono",monospace; font-size:0.78rem; letter-spacing:0.02em; color:var(--brass-bright); margin:0 0 0.4rem;}
h1{
  font-family:"Fraunces", serif; font-weight:600; font-style:italic;
  font-size:clamp(1.9rem, 5vw, 2.9rem); line-height:1.05; margin:0 0 0.6rem; color:#f3ecd8;
}
.sub{color:#cfc6ad; max-width:52ch; line-height:1.5; margin:0; font-size:0.98rem;}

.search{
  margin:1.75rem 0 1.5rem; position:relative;
}
.search input{
  width:100%; padding:0.85rem 1rem; font-size:1rem; border-radius:3px;
  border:1px solid var(--brass); background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Mono",monospace;
}
.search input:focus{outline:2px solid var(--brass-bright); outline-offset:2px;}
.search input::placeholder{color:var(--ink); opacity:0.45;}

.drawers{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:0.9rem;
}
.drawer{
  background:var(--paper); border:1px solid var(--line); border-radius:2px;
  padding:1rem 1.1rem; cursor:pointer; text-align:left; box-shadow:var(--shadow);
  position:relative; transition:transform 0.15s ease;
}
.drawer:hover, .drawer:focus-visible{transform:translateY(-2px);}
.drawer:focus-visible{outline:2px solid var(--brass-bright); outline-offset:2px;}
.drawer .code{
  font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--brass);
  font-size:1.4rem; display:block;
}
.drawer .name{font-size:0.92rem; line-height:1.3; margin-top:0.3rem; display:block;}
.drawer .pull{
  position:absolute; top:0.9rem; right:0.9rem; width:22px; height:22px;
  border:2px solid var(--brass); border-radius:50%;
}

.panel{
  margin-top:1.75rem; background:var(--paper-2); border:1px solid var(--line);
  border-radius:3px; box-shadow:var(--shadow); overflow:hidden;
}
.panel-head{
  display:flex; align-items:baseline; gap:0.75rem; padding:1.1rem 1.25rem;
  border-bottom:1px solid var(--line); background:var(--paper);
}
.panel-head .code{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--brass); font-size:1.3rem;}
.panel-head h2{font-family:"Fraunces",serif; font-weight:600; font-size:1.25rem; margin:0; flex:1;}
.panel-head button{
  background:none; border:1px solid var(--line); color:var(--ink); border-radius:2px;
  font-size:0.85rem; padding:0.35rem 0.6rem; cursor:pointer; font-family:inherit;
}
.panel-head button:hover{border-color:var(--brass);}
.cards{display:block;}
.card-row{
  display:flex; gap:1rem; padding:0.7rem 1.25rem; border-bottom:1px solid var(--line);
  align-items:baseline;
}
.card-row:last-child{border-bottom:none;}
.card-row .code{font-family:"IBM Plex Mono",monospace; color:var(--brass); min-width:3.2rem; font-weight:600;}
.card-row .name{font-size:0.95rem; line-height:1.4;}

.results{display:none; margin-top:1.75rem;}
.results.active{display:block;}
.results .card-row{background:var(--paper-2); border-bottom:1px solid var(--line);}
.results .card-row:first-child{border-top:1px solid var(--line);}
.empty{color:#cfc6ad; padding:1.5rem 0.25rem; font-size:0.95rem;}

footer{margin-top:2.5rem; font-size:0.8rem; color:#a89d80; font-family:"IBM Plex Mono",monospace;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Sistema de Clasificación Decimal Dewey</p>
    <h1>El fichero de las cien casillas</h1>
    <p class="sub">Diez clases, cada una dividida en diez casilleros. Abre una clase para ver sus divisiones, o busca directamente por número o tema.</p>
  </header>

  <div class="search">
    <input type="text" id="searchInput" placeholder="Buscar por número (ej. 610) o palabra (ej. música)…" autocomplete="off">
  </div>

  <div class="results" id="results"></div>

  <div class="drawers" id="drawers"></div>
  <div class="panel" id="panel" style="display:none;"></div>

  <footer>Tabla principal CDD/DDC · 10 clases · 100 divisiones</footer>
</div>

<script>
const DEWEY = [
  {code:"000", name:"Ciencias de la computación, información y obras generales", div:[
    ["000","Generalidades, ciencia de la computación"],["010","Bibliografía"],
    ["020","Biblioteconomía y ciencias de la información"],["030","Enciclopedias y libros de datos"],
    ["040","(sin asignar)"],["050","Publicaciones periódicas generales"],
    ["060","Organizaciones generales y museología"],["070","Periodismo, medios, editoriales"],
    ["080","Colecciones generales"],["090","Manuscritos y libros raros"]]},
  {code:"100", name:"Filosofía y psicología", div:[
    ["100","Filosofía"],["110","Metafísica"],["120","Epistemología, causalidad, humanidad"],
    ["130","Fenómenos paranormales"],["140","Escuelas filosóficas específicas"],
    ["150","Psicología"],["160","Lógica"],["170","Ética (filosofía moral)"],
    ["180","Filosofía antigua, medieval, oriental"],["190","Filosofía occidental moderna"]]},
  {code:"200", name:"Religión", div:[
    ["200","Religión"],["210","Filosofía y teoría de la religión"],["220","La Biblia"],
    ["230","Cristianismo, teología cristiana"],["240","Moral cristiana y vida devota"],
    ["250","Órdenes cristianas y gobierno local"],["260","Teología social y eclesiástica"],
    ["270","Historia del cristianismo"],["280","Iglesias y denominaciones cristianas"],
    ["290","Religión comparada y otras religiones"]]},
  {code:"300", name:"Ciencias sociales", div:[
    ["300","Ciencias sociales, sociología, antropología"],["310","Estadística general"],
    ["320","Ciencia política"],["330","Economía"],["340","Derecho"],
    ["350","Administración pública y ciencia militar"],["360","Problemas y servicios sociales"],
    ["370","Educación"],["380","Comercio, comunicaciones, transporte"],
    ["390","Costumbres, etiqueta, folclore"]]},
  {code:"400", name:"Lenguas", div:[
    ["400","Lenguas"],["410","Lingüística"],["420","Inglés e inglés antiguo"],
    ["430","Lenguas germánicas; alemán"],["440","Lenguas románicas; francés"],
    ["450","Italiano, rumano, retorrománico"],["460","Español y portugués"],
    ["470","Lenguas itálicas; latín"],["480","Lenguas helénicas; griego clásico"],
    ["490","Otras lenguas"]]},
  {code:"500", name:"Ciencia", div:[
    ["500","Ciencia"],["510","Matemáticas"],["520","Astronomía"],["530","Física"],
    ["540","Química"],["550","Ciencias de la tierra"],["560","Paleontología"],
    ["570","Biología"],["580","Plantas (Botánica)"],["590","Animales (Zoología)"]]},
  {code:"600", name:"Tecnología", div:[
    ["600","Tecnología"],["610","Medicina y salud"],["620","Ingeniería"],
    ["630","Agricultura"],["640","Gestión del hogar y vida familiar"],
    ["650","Gestión y servicios auxiliares"],["660","Ingeniería química"],
    ["670","Manufactura"],["680","Manufactura para usos específicos"],
    ["690","Construcción de edificios"]]},
  {code:"700", name:"Artes y recreación", div:[
    ["700","Artes"],["710","Urbanismo y paisajismo"],["720","Arquitectura"],
    ["730","Artes plásticas; escultura"],["740","Dibujo y artes decorativas"],
    ["750","Pintura"],["760","Artes gráficas; grabado"],["770","Fotografía"],
    ["780","Música"],["790","Deportes, juegos, entretenimiento"]]},
  {code:"800", name:"Literatura", div:[
    ["800","Literatura, retórica, crítica"],["810","Literatura estadounidense en inglés"],
    ["820","Literatura inglesa e inglesa antigua"],["830","Literaturas germánicas; alemana"],
    ["840","Literaturas románicas; francesa"],["850","Italiana, rumana, retorrománica"],
    ["860","Española y portuguesa"],["870","Literaturas itálicas; latina"],
    ["880","Literaturas helénicas; griega clásica"],["890","Literatura de otras lenguas"]]},
  {code:"900", name:"Historia y geografía", div:[
    ["900","Historia"],["910","Geografía y viajes"],["920","Biografía y genealogía"],
    ["930","Historia del mundo antiguo"],["940","Historia de Europa"],
    ["950","Historia de Asia"],["960","Historia de África"],
    ["970","Historia de América del Norte"],["980","Historia de América del Sur"],
    ["990","Historia de otras partes"]]}
];

const drawersEl = document.getElementById('drawers');
const panelEl = document.getElementById('panel');
const resultsEl = document.getElementById('results');
const searchInput = document.getElementById('searchInput');

function renderDrawers(){
  drawersEl.innerHTML = DEWEY.map((c,i) => `
    <button class="drawer" data-i="${i}" aria-expanded="false">
      <span class="pull" aria-hidden="true"></span>
      <span class="code">${c.code}</span>
      <span class="name">${c.name}</span>
    </button>`).join('');
  drawersEl.querySelectorAll('.drawer').forEach(btn=>{
    btn.addEventListener('click', ()=> openDrawer(parseInt(btn.dataset.i)));
  });
}

function openDrawer(i){
  const c = DEWEY[i];
  panelEl.style.display = 'block';
  panelEl.innerHTML = `
    <div class="panel-head">
      <span class="code">${c.code}</span>
      <h2>${c.name}</h2>
      <button id="closePanel">Cerrar</button>
    </div>
    <div class="cards">
      ${c.div.map(d=>`<div class="card-row"><span class="code">${d[0]}</span><span class="name">${d[1]}</span></div>`).join('')}
    </div>`;
  document.getElementById('closePanel').addEventListener('click', ()=>{
    panelEl.style.display='none'; panelEl.innerHTML='';
  });
  panelEl.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function search(q){
  q = q.trim().toLowerCase();
  if(!q){ resultsEl.classList.remove('active'); resultsEl.innerHTML=''; drawersEl.style.display='grid'; panelEl.style.display = panelEl.innerHTML ? panelEl.style.display : 'none'; return; }
  drawersEl.style.display='none';
  panelEl.style.display='none';
  let matches = [];
  DEWEY.forEach(c=>{
    c.div.forEach(d=>{
      if(d[0].includes(q) || d[1].toLowerCase().includes(q)){
        matches.push(d);
      }
    });
  });
  resultsEl.classList.add('active');
  resultsEl.innerHTML = matches.length
    ? matches.map(d=>`<div class="card-row"><span class="code">${d[0]}</span><span class="name">${d[1]}</span></div>`).join('')
    : `<p class="empty">Sin resultados para «${q}». Prueba con un número (ej. 8) o una palabra clave.</p>`;
}

searchInput.addEventListener('input', e => search(e.target.value));

renderDrawers();
</script>
</body>
</html>
